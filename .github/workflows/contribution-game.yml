name: Generate Pac-Man / Galaga Game

on:
  schedule:
    # Run automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate-pacman-game-from-github-contribution-grid
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: Saravanakumar2602
          games: 'pacman,galaga'

      - name: Push contribution graphs to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
